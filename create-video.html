<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Video | AI Text-to-Video Slideshow Creator</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="create-video.css">
</head>

<body>

    <section class="create-video-page">

        <!-- Decorative Circles -->
        <div class="circle circle-one"></div>
        <div class="circle circle-two"></div>
        <div class="circle circle-three"></div>

        <!-- Main Card -->
        <div class="video-card">

            <!-- Logo -->
            <div class="logo-box">
                <i class="bi bi-stars"></i>
            </div>

            <!-- Heading -->
            <h1>Create Your Video</h1>

            <p class="subtitle">
                AI Text-to-Video Slideshow Creator
            </p>

            <form>

                <!-- Video Title -->
                <div class="input-box">
                    <label for="videoTitle">
                        Video Title
                    </label>

                    <div class="input-wrapper">
                        <i class="bi bi-card-heading"></i>

                        <input
                            type="text"
                            id="videoTitle"
                            class="form-control"
                            placeholder="Enter your video title"
                            required>
                    </div>
                </div>


                <!-- Enter Your Text -->
                <div class="input-box">
                    <label for="videoText">
                        Video Discription
                    </label>

                    <div class="input-wrapper textarea-wrapper">
                        <i class="bi bi-file-text"></i>

                        <textarea
                            id="videoText"
                            class="form-control"
                            rows="5"
                            placeholder="Enter the text you want to convert into a video..."
                            required></textarea>
                    </div>
                </div>


                <!-- Style + Duration -->
<div class="row g-3">

    <!-- Select Style -->
    <div class="col-md-6">

        <div class="input-box">

            <label for="videoStyle">
                Select Style
            </label>

            <div class="input-wrapper select-wrapper">

                <i class="bi bi-palette"></i>

                <select
                    id="videoStyle"
                    class="form-select"
                    required>

                    <option value="" selected disabled>
                        Select video style
                    </option>

                    <option value="educational">
                        Educational
                    </option>

                    <option value="professional">
                        Professional
                    </option>

                    <option value="creative">
                        Creative
                    </option>

                    <option value="promotional">
                        Promotional
                    </option>

                    <option value="informative">
                        Informative
                    </option>

                </select>

                <i class="bi bi-chevron-down dropdown-icon"></i>

            </div>

        </div>

    </div>


    <!-- Select Duration -->
    <div class="col-md-6">

        <div class="input-box">

            <label for="duration">
                Select Duration
            </label>

            <div class="input-wrapper select-wrapper">

                <i class="bi bi-clock"></i>

                <select
                    id="duration"
                    class="form-select"
                    required>

                    <option value="" selected disabled>
                        Select duration
                    </option>

                    <option value="30">
                        30 Seconds
                    </option>

                    <option value="60">
                        1 Minute
                    </option>

                    <option value="120">
                        2 Minutes
                    </option>

                    <option value="180">
                        3 Minutes
                    </option>

                    <option value="300">
                        5 Minutes
                    </option>

                </select>

                <i class="bi bi-chevron-down dropdown-icon"></i>

            </div>

        </div>

    </div>

</div>


                <!-- Video Level -->
                <div class="input-box">
                    <label for="videoLevel">
                        Video Level
                    </label>

                    <div class="input-wrapper select-wrapper">

    <i class="bi bi-bar-chart"></i>

    <select
        id="videoLevel"
        class="form-select"
        required>

        <option value="" selected disabled>
            Select video level
        </option>

        <option value="normal">
            Normal
        </option>

        <option value="medium">
            Medium
        </option>

        <option value="standard">
            Standard
        </option>

    </select>

    <i class="bi bi-chevron-down dropdown-icon"></i>

</div>


                <!-- Create Video Button -->
                <button
                    type="submit"
                    class="create-btn">

                    <span>Create Video</span>

                    <i class="bi bi-arrow-right"></i>

                </button>

            </form>


            <!-- Footer -->
            <p class="copyright">
                © 2026 AI Text-to-Video Slideshow Creator
            </p>

        </div>

    </section>

</body>

</html>

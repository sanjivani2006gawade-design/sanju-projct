<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | AI Text-to-Video Slideshow Creator</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="registration.css">
</head>

<body>

    <section class="registration-page">

        <!-- Background Decorative Circles -->
        <div class="circle circle-one"></div>
        <div class="circle circle-two"></div>
        <div class="circle circle-three"></div>


        <!-- Registration Card -->
        <div class="registration-card">

            <!-- Logo -->
            <div class="logo-box">
                <i class="bi bi-stars"></i>
            </div>


            <!-- Heading -->
            <h1>Create Your Account</h1>

            <p class="subtitle">
                AI Text-to-Video Slideshow Creator
            </p>


            <!-- Registration Form -->
            <form>


                <!-- Full Name -->
                <div class="input-box">

                    <label for="fullName">
                        Full Name
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-person"></i>

                        <input
                            type="text"
                            id="fullName"
                            class="form-control"
                            placeholder="Enter your full name"
                            required>

                    </div>

                </div>


                <!-- Email -->
                <div class="input-box">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-envelope"></i>

                        <input
                            type="email"
                            id="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required>

                    </div>

                </div>


                <!-- Password -->
                <div class="input-box">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-lock"></i>

                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Create a password"
                            required>

                    </div>

                </div>


                <!-- Confirm Password -->
                <div class="input-box">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="input-wrapper">

                        <i class="bi bi-shield-check"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-control"
                            placeholder="Confirm your password"
                            required>

                    </div>

                </div>


                <!-- Terms and Conditions -->
                <div class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required>

                    <label for="terms">
                        I agree to the
                        <a href="#">Terms & Conditions</a>
                    </label>

                </div>


                <!-- Create Account Button -->
                <button
                    type="submit"
                    class="create-btn">

                    <span>Create Account</span>

                    <i class="bi bi-arrow-right"></i>

                </button>

            </form>


            <!-- Divider -->
            <div class="divider">

                <span>OR</span>

            </div>


            <!-- Login -->
            <p class="login-text">

                Already have an account?

                <a href="index.html">
                    Login
                </a>

            </p>


            

        </div>

    </section>

</body>

</html>
